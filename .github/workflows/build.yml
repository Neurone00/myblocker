name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      GIT_SHA: ${{ github.sha }}
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Optional private signing key from secrets
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect
        id: collect
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK" .apk)" >> "$GITHUB_OUTPUT"
          echo "version=1.0.0-b${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.name }}
          path: |
            ${{ steps.collect.outputs.apk }}
            ${{ steps.collect.outputs.apk }}.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.collect.outputs.version }}
          name: MyBlocker v${{ steps.collect.outputs.version }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          target_commitish: ${{ github.sha }}
          body: |
            Automated build of `${{ github.ref_name }}` @ ${{ github.sha }}.

            **Install:** download the `.apk` below on your phone, open it, allow installs from your browser if asked. Updates install over the previous version (same signing key).

            Version code `${{ github.run_number }}`, version name `${{ steps.collect.outputs.version }}`.
          files: |
            ${{ steps.collect.outputs.apk }}
            ${{ steps.collect.outputs.apk }}.sha256
