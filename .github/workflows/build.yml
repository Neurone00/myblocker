name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Every run also updates the rolling "adbrella-latest" release, so never let two overlap.
concurrency:
  group: adbrella-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      GIT_SHA: ${{ github.sha }}
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Optional private signing key from secrets
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect outputs and write update manifest
        id: collect
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          NAME=$(basename "$APK" .apk)
          VERSION="1.0.0-b${{ github.run_number }}"
          mkdir -p out
          cp "$APK" "out/$NAME.apk"
          cp "$APK" out/adbrella.apk
          SHA=$(sha256sum out/adbrella.apk | cut -d' ' -f1)
          SIZE=$(stat -c%s out/adbrella.apk)
          echo "$SHA  $NAME.apk" > "out/$NAME.apk.sha256"
          cat > out/update.json <<JSON
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "$VERSION",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/adbrella-latest/adbrella.apk",
            "sha256": "$SHA",
            "size": $SIZE,
            "commit": "${{ github.sha }}"
          }
          JSON
          cat out/update.json
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.name }}
          path: out/*
          if-no-files-found: error

      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.collect.outputs.version }}
          name: Adbrella v${{ steps.collect.outputs.version }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          target_commitish: ${{ github.sha }}
          body: |
            Build of `${{ github.ref_name }}` @ ${{ github.sha }}.

            **Install:** download the `.apk` below on your phone and open it. Later builds install over earlier ones, and the app updates itself from the rolling **adbrella-latest** release.

            Version code `${{ github.run_number }}`, version name `${{ steps.collect.outputs.version }}`.
          files: |
            out/${{ steps.collect.outputs.name }}.apk
            out/${{ steps.collect.outputs.name }}.apk.sha256

      - name: Update rolling "latest" release (what the app's self-updater reads)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: adbrella-latest
          name: Adbrella (latest build)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            ☂ Adbrella build ${{ steps.collect.outputs.version }} from `${{ github.ref_name }}` @ ${{ github.sha }}.
            Install **adbrella.apk** once; from then on the app updates itself from this page.
          files: |
            out/adbrella.apk
            out/update.json
